---
# ============================================
# Unattended Upgrades Role
# ============================================
# Purpose: Apply security updates automatically.
# The Debian security suite and the Raspberry Pi repository are allowed.
# Docker CE updates are allowed because Docker publishes fixes there.
# Automatic reboot is off by default. Set unattended_upgrades_auto_reboot
# to true to reboot at 04:00 after a kernel update.
# ============================================

- name: Install unattended-upgrades
  apt:
    name: unattended-upgrades
    state: present
    update_cache: yes

- name: Configure periodic update checks
  template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: '0644'

- name: Configure allowed update origins
  template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: '0644'

- name: Enable and start unattended-upgrades
  systemd:
    name: unattended-upgrades
    enabled: yes
    state: started
